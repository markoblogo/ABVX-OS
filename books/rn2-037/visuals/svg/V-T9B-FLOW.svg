<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="t d"><title id="t">The feed-line chain flow</title><desc id="d">Original concept diagram for T9B linking 50 ohms, coax, loss, connector choice, SWR.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#171717"/></marker></defs><style>.line{stroke:#171717;stroke-width:4;fill:none}.node{fill:#DADADA}.warm{fill:#EFEFEF}.core{fill:#171717}text{font-family:Arial,sans-serif;fill:#171717;text-anchor:middle}.label{font-size:25px;font-weight:700}.small{font-size:18px;font-weight:700}.tiny{font-size:15px;fill:#fff}circle+text{fill:#fff}</style><rect width="800" height="560" fill="#fff"/><text x="202" y="125" class="label">recognize</text><text x="597" y="125" class="label">connect</text><path d="M350 280 L450 280" class="line" marker-end="url(#arrow)"/><rect x="70" y="175" width="265" height="58" rx="10" class="node"/><text x="202" y="210" class="small">50 ohms</text><rect x="70" y="267" width="265" height="58" rx="10" class="node"/><text x="202" y="302" class="small">coax</text><rect x="70" y="359" width="265" height="58" rx="10" class="node"/><text x="202" y="394" class="small">loss</text><rect x="465" y="175" width="265" height="58" rx="10" class="warm"/><text x="597" y="210" class="small">connector choice</text><rect x="465" y="267" width="265" height="58" rx="10" class="warm"/><text x="597" y="302" class="small">SWR</text></svg>