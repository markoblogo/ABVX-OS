<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="t d"><title id="t">Where a Technician may transmit map</title><desc id="d">Original concept diagram for T1B linking 10-meter voice, VHF and UHF, CW segments, shared bands, power limits.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#171717"/></marker></defs><style>.line{stroke:#171717;stroke-width:4;fill:none}.node{fill:#DADADA}.warm{fill:#EFEFEF}.core{fill:#171717}text{font-family:Arial,sans-serif;fill:#171717;text-anchor:middle}.label{font-size:25px;font-weight:700}.small{font-size:18px;font-weight:700}.tiny{font-size:15px;fill:#fff}circle+text{fill:#fff}</style><rect width="800" height="560" fill="#fff"/><line x1="400" y1="280" x2="400.0" y2="110.0" class="line"/><line x1="400" y1="280" x2="633.0" y2="227.5" class="line"/><line x1="400" y1="280" x2="544.0" y2="417.5" class="line"/><line x1="400" y1="280" x2="256.0" y2="417.5" class="line"/><line x1="400" y1="280" x2="167.0" y2="227.5" class="line"/><circle cx="400" cy="280" r="82" class="core"/><text x="400" y="272" class="label">T1B</text><text x="400" y="298" class="tiny">one connected model</text><rect x="320.0" y="85.0" width="160" height="50" rx="10" class="node"/><text x="400.0" y="115.0" class="small">10-meter voice</text><rect x="553.0" y="202.5" width="160" height="50" rx="10" class="node"/><text x="633.0" y="232.5" class="small">VHF and UHF</text><rect x="464.0" y="392.5" width="160" height="50" rx="10" class="node"/><text x="544.0" y="422.5" class="small">CW segments</text><rect x="176.0" y="392.5" width="160" height="50" rx="10" class="node"/><text x="256.0" y="422.5" class="small">shared bands</text><rect x="87.0" y="202.5" width="160" height="50" rx="10" class="node"/><text x="167.0" y="232.5" class="small">power limits</text></svg>