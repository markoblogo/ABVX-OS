<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="t d"><title id="t">First station and operating controls map</title><desc id="d">Original concept diagram for CH08 linking T4A, T4B, review.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#171717"/></marker></defs><style>.line{stroke:#171717;stroke-width:4;fill:none}.node{fill:#DADADA}.warm{fill:#EFEFEF}.core{fill:#171717}text{font-family:Arial,sans-serif;fill:#171717;text-anchor:middle}.label{font-size:25px;font-weight:700}.small{font-size:18px;font-weight:700}.tiny{font-size:15px;fill:#fff}circle+text{fill:#fff}</style><rect width="800" height="560" fill="#fff"/><line x1="400" y1="280" x2="400.0" y2="110.0" class="line"/><line x1="400" y1="280" x2="612.2" y2="365.0" class="line"/><line x1="400" y1="280" x2="187.8" y2="365.0" class="line"/><circle cx="400" cy="280" r="82" class="core"/><text x="400" y="272" class="label">CH08</text><text x="400" y="298" class="tiny">one connected model</text><rect x="320.0" y="85.0" width="160" height="50" rx="10" class="node"/><text x="400.0" y="115.0" class="small">T4A</text><rect x="532.2" y="340.0" width="160" height="50" rx="10" class="node"/><text x="612.2" y="370.0" class="small">T4B</text><rect x="107.8" y="340.0" width="160" height="50" rx="10" class="node"/><text x="187.8" y="370.0" class="small">review</text></svg>